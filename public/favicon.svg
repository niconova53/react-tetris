<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8f8"/>
      <stop offset="1" stop-color="#ffdde4"/>
    </linearGradient>
  </defs>

  <!-- Fondo candy pill -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ff4d6d" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Pieza "L" con paleta candy (limón / fresa / arándano) -->
  <!-- columna vertical izquierda -->
  <rect x="20" y="14" width="12" height="12" rx="3" fill="#ffd60a"/>
  <rect x="20" y="27" width="12" height="12" rx="3" fill="#4cc9f0"/>
  <rect x="20" y="40" width="12" height="12" rx="3" fill="#ef476f"/>
  <!-- extensión derecha abajo -->
  <rect x="33" y="40" width="12" height="12" rx="3" fill="#ff9f1c"/>

  <!-- highlight suave en cada celda (efecto "hard shell") -->
  <rect x="20" y="14" width="12" height="12" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="20" y="27" width="12" height="12" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="20" y="40" width="12" height="12" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="33" y="40" width="12" height="12" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>